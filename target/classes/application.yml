server:
  port: 8082

spring:
  application:
    name: village-temple-management
  datasource:
    url: jdbc:h2:mem:templedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  security:
    user:
      name: admin
      password: temple123
      roles: ADMIN
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

opensearch:
  host: http://localhost:9200
  username: admin
  password: admin
  index: temple-documents

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  base-url: https://api.openai.com/v1
